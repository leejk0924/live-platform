<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC 시청</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; max-width: 720px; }
  label { display: block; margin: 4px 0; }
  video { width: 100%; background: #000; }
  pre { background: #f3f3f3; padding: 8px; white-space: pre-wrap; }
  button { font-size: 16px; padding: 8px 16px; margin: 0 8px 8px 0; }
</style>
</head>
<body>
<h1>PoC 시청</h1>
<label>경로 <input id="path" value="poc"></label>
<button id="hls">LL-HLS (브라우저 내장)</button><button id="whep">WHEP</button><button id="unmute">소리 켜기</button>
<p id="state">대기</p>
<video id="video" autoplay muted playsinline controls></video>
<h2>재생 상태 (1초 간격)</h2>
<pre id="stats">-</pre>
<p>내장 HLS가 없는 브라우저(Android Chrome 등)는 <a id="mtxhls" href="#">MediaMTX hls.js 플레이어</a>로 확인한다.</p>
<script type="module">
import { mediaUrl, negotiate, rtpSampler } from './webrtc.js'

const $ = (id) => document.getElementById(id)
const video = $('video')
let session = null
let timer = null

$('mtxhls').href = `${mediaUrl('hls', $('path').value)}/`
$('path').oninput = () => { $('mtxhls').href = `${mediaUrl('hls', $('path').value)}/` }

function reset() {
  clearInterval(timer)
  session?.pc?.close()
  session = null
  video.removeAttribute('src')
  video.srcObject = null
}

// The iOS question is whether the native player decodes the Opus track, so audio progress is read from the element itself.
function elementState() {
  return {
    readyState: video.readyState,
    paused: video.paused,
    muted: video.muted,
    currentTime: Number(video.currentTime.toFixed(2)),
    videoSize: `${video.videoWidth}x${video.videoHeight}`,
    audioTracks: video.audioTracks?.length,
    webkitAudioDecodedByteCount: video.webkitAudioDecodedByteCount,
    webkitVideoDecodedByteCount: video.webkitVideoDecodedByteCount,
    error: video.error && `${video.error.code} ${video.error.message}`,
  }
}

function playHls() {
  reset()
  const src = `${mediaUrl('hls', $('path').value)}/index.m3u8`
  const support = video.canPlayType('application/vnd.apple.mpegurl')
  if (!support) {
    $('state').textContent = '이 브라우저는 내장 HLS가 없다. 아래 MediaMTX 플레이어 링크를 쓴다.'
    return
  }
  video.src = src
  video.play().catch(() => {})
  $('state').textContent = `LL-HLS 내장 재생: ${src}`
  timer = setInterval(() => {
    $('stats').textContent = JSON.stringify({ mode: 'hls-native', canPlayType: support, ...elementState() }, null, 2)
  }, 1000)
}

async function playWhep() {
  reset()
  const pc = new RTCPeerConnection()
  pc.addTransceiver('video', { direction: 'recvonly' })
  pc.addTransceiver('audio', { direction: 'recvonly' })
  const stream = new MediaStream()
  pc.ontrack = (e) => stream.addTrack(e.track)
  video.srcObject = stream
  session = { pc }
  await negotiate(pc, `${mediaUrl('webrtc', $('path').value)}/whep`)
  video.play().catch(() => {})
  $('state').textContent = 'WHEP 재생'
  const sample = rtpSampler(pc, 'inbound-rtp')
  timer = setInterval(async () => {
    $('stats').textContent = JSON.stringify({
      mode: 'whep', ice: pc.iceConnectionState, received: await sample(), ...elementState(),
    }, null, 2)
  }, 1000)
}

$('hls').onclick = playHls
$('whep').onclick = () => playWhep().catch((e) => { $('state').textContent = `실패: ${e.message}` })
$('unmute').onclick = () => { video.muted = false; video.play().catch(() => {}) }
</script>
</body>
</html>
