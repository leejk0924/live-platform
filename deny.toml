[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Hexagonal dependency direction. `wrappers` lists the only crates allowed to
# depend directly on the banned crate, so an inward-pointing edge fails CI.
# This list only names known adapter crates; scripts/check-layer-deps.sh
# allowlists what domain and application may depend on at all.
deny = [
    { crate = "application", wrappers = ["infrastructure", "api"], reason = "application is used only by adapters and the composition root" },
    { crate = "infrastructure", wrappers = ["api"], reason = "only the composition root wires adapters" },

    { crate = "axum", wrappers = ["api"], reason = "HTTP framework belongs to the inbound adapter" },
    { crate = "tower-http", wrappers = ["api"], reason = "HTTP middleware belongs to the inbound adapter" },
    { crate = "sqlx", wrappers = ["infrastructure"], reason = "persistence is an outbound adapter" },
    { crate = "reqwest", wrappers = ["infrastructure"], reason = "outbound HTTP clients are adapters" },
    { crate = "jsonwebtoken", wrappers = ["infrastructure"], reason = "token signing is an outbound adapter" },
    { crate = "aws-config", wrappers = ["infrastructure"], reason = "cloud SDKs are outbound adapters" },
    { crate = "aws-sdk-s3", wrappers = ["infrastructure"], reason = "cloud SDKs are outbound adapters" },
]
