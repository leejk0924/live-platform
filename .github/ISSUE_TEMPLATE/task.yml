name: 작업
description: 하나의 작업 단위. PR 여러 개가 이 이슈에 붙을 수 있다.
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 이슈가 끝나면 무엇이 가능해지는가.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 하는 것과 하지 않는 것.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인 가능한 조건으로 적는다.
      value: |
        - [ ] `cargo fmt --all -- --check`
        - [ ] `cargo clippy --all-targets -- -D warnings`
        - [ ] `cargo test --workspace`
        - [ ] `cargo deny check`
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: 관련 ADR
      description: "docs/adr/<area>/<issue>-<slug>.md. 없으면 비워 둔다."
      placeholder: docs/adr/common/1-hexagonal-five-planes.md
  - type: markdown
    attributes:
      value: |
        브랜치는 `<type>/<issue>` (예: `feat/6`). 규칙은 `docs/DEVELOPMENT.md`.
        PR 본문에는 `Refs #N`, 이 이슈의 마지막 PR에만 `Closes #N`.
