name: live-platform

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    user: "65532:65532"
    environment:
      SITE_ADDRESS: localhost
      # The internal CA is accepted by hand, which browsers refuse on an HSTS host. compose.prod.yml turns it on.
      HSTS_MAX_AGE: "0"
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    user: "65532:65532"
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      ALLOWED_ORIGINS: https://localhost
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      PUBLISH_JWT_PRIVATE_KEY: ${PUBLISH_JWT_PRIVATE_KEY:?set PUBLISH_JWT_PRIVATE_KEY in .env}
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:?set MEDIA_HOOK_SECRET in .env}
      # Empty means local storage; s3 needs every S3_* and CLOUDFRONT_* value.
      RECORDING_STORAGE: ${RECORDING_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      # Toss Payments test keys; both empty turns donations off.
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    volumes:
      # MediaMTX writes finished segments to the spool; the API copies them to the store.
      - recording_spool:/recordings
      - recording_store:/recording-store
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 256

  mediamtx:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/mediamtx.Dockerfile
    user: "65532:65532"
    environment:
      MTX_AUTHHTTPADDRESS: http://mediamtx:${MEDIA_HOOK_SECRET:?set MEDIA_HOOK_SECRET in .env}@api:8080/internal/media/auth
      # Expanded by MediaMTX in the runOnAvailable / runOnUnavailable commands.
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:?set MEDIA_HOOK_SECRET in .env}
    volumes:
      - recording_spool:/recordings
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    healthcheck:
      # The Control API now needs a JWT; the WebRTC listener's bundled script answers without one.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8889/publisher.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256

  postgres:
    <<: *hardening
    image: postgres:17.11-trixie@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    user: "999:999"
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 128

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  recording_spool:
  recording_store:
