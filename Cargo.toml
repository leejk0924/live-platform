[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"

argon2 = "0.6"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = "3"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
rusty-s3 = { version = "0.12", default-features = false, features = ["rustcrypto"] }
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
subtle = "2"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
strip = true

# Unoptimized argon2 takes about a second per hash, which dominates test time.
[profile.dev.package.argon2]
opt-level = 3
