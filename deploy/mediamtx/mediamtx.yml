logLevel: info
logDestinations: [stdout]

# Anyone may watch. Publishing and the Control API need a JWT signed by the API's key:
# a publish token covers one path, and the API signs its own short `api` token to kick.
# MediaMTX fetches the JWKS on the first JWT check (not at startup), retries on failure,
# and then keeps it for an hour; after rotating PUBLISH_JWT_PRIVATE_KEY, restart mediamtx.
authMethod: jwt
authJWTJWKS: http://api:8080/api/.well-known/jwks.json
authJWTClaimKey: mediamtx_permissions
# Must equal infrastructure::media::jwt::ISSUER.
authJWTIssuer: live-platform
authJWTExclude:
  - action: read
  - action: playback

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false

rtsp: false
rtmp: false
srt: false
moq: false

hls: true
hlsAddress: :8888
hlsVariant: lowLatency

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Set per environment through MTX_WEBRTCADDITIONALHOSTS (the public IP in prod).
webrtcAdditionalHosts: []

paths:
  all_others:
    # A second publisher with a valid token is refused instead of replacing the live one.
    overridePublisher: false
